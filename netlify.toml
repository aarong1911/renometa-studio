[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Android beta APK (static file from public/downloads, served before the SSR function).
[[headers]]
  for = "/downloads/RenoMeta-Connect-Android-test.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"RenoMeta-Connect-Android-test.apk\""
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = true
